name: Backend CI

on:
  push:
    branches:
      - main
      - develop
    paths:
      - ".github/workflows/backend-ci.yml"
      - "ai/**"
      - "banking/**"
      - "compliance/**"
      - "gamification/**"
      - "subscriptions/**"
      - "transactions/**"
      - "users/**"
      - "valuations/**"
      - "zapp/**"
      - "manage.py"
      - "requirements.txt"
  pull_request:
    paths:
      - ".github/workflows/backend-ci.yml"
      - "ai/**"
      - "banking/**"
      - "compliance/**"
      - "gamification/**"
      - "subscriptions/**"
      - "transactions/**"
      - "users/**"
      - "valuations/**"
      - "zapp/**"
      - "manage.py"
      - "requirements.txt"
  workflow_dispatch:

concurrency:
  group: backend-ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.13"]

    env:
      SECRET_KEY: ci-secret-key
      DATABASE_URL: sqlite:///tmp/zapp-ci-base.sqlite3
      DJANGO_SETTINGS_MODULE: zapp.settings.test
      OPENAI_API_KEY: ""
      SUPABASE_URL: https://example.supabase.co
      SUPABASE_JWT_ISS: https://example.supabase.co/auth/v1
      SUPABASE_JWT_AUD: authenticated
      SUPABASE_ANON_KEY: ci-anon-key
      SUPABASE_JWT_SECRET: ci-jwt-secret
      PLAID_CLIENT_ID: ci-plaid-client
      PLAID_SECRET: ci-plaid-secret
      PLAID_ENV: sandbox
      PRIVACY_POLICY_URL: https://example.com/privacy
      PRIVACY_POLICY_VERSION: 1.0.0
      PRIVACY_POLICY_EFFECTIVE_DATE: 2026-01-01

    steps:
      - name: Check out code
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip
          cache-dependency-path: requirements.txt

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Run Django system checks
        run: python manage.py check

      - name: Run migrations check
        run: python manage.py makemigrations --check --dry-run

      - name: Run backend tests
        run: python manage.py test --verbosity 2
