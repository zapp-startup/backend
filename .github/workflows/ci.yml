name: CI

on:
  push:
    branches: [main, master, develop]
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install dependencies
        run: |
          pip install -r .docs/requirements.txt
      - name: Django checks
        env:
          SECRET_KEY: ci-not-for-production
          DATABASE_URL: sqlite:///./ci.sqlite3
          SUPABASE_URL: https://example.supabase.co
          SUPABASE_JWT_ISS: https://example.supabase.co/auth/v1
          SUPABASE_ANON_KEY: test-anon-key
        run: |
          python manage.py check --settings=zapp.settings.test
      - name: Tests
        env:
          SECRET_KEY: ci-not-for-production
          DATABASE_URL: sqlite:///./ci.sqlite3
          SUPABASE_URL: https://example.supabase.co
          SUPABASE_JWT_ISS: https://example.supabase.co/auth/v1
          SUPABASE_ANON_KEY: test-anon-key
        run: |
          python manage.py test --settings=zapp.settings.test --parallel 1
