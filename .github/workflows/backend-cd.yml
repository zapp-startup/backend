name: Backend CD

on:
  push:
    branches:
      - main
    paths:
      - ".github/workflows/backend-cd.yml"
      - "ai/**"
      - "banking/**"
      - "compliance/**"
      - "gamification/**"
      - "subscriptions/**"
      - "transactions/**"
      - "users/**"
      - "valuations/**"
      - "zapp/**"
      - "manage.py"
      - "requirements.txt"
  workflow_dispatch:

concurrency:
  group: backend-cd-main
  cancel-in-progress: false

jobs:
  validate:
    runs-on: ubuntu-latest
    environment: production
    env:
      SECRET_KEY: ${{ secrets.SECRET_KEY }}
      DATABASE_URL: ${{ secrets.DATABASE_URL }}
      ALLOWED_HOSTS: ${{ secrets.ALLOWED_HOSTS }}
      OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}
      OPENAI_MODEL: ${{ secrets.OPENAI_MODEL }}
      SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
      SUPABASE_JWT_ISS: ${{ secrets.SUPABASE_JWT_ISS }}
      SUPABASE_JWT_AUD: ${{ secrets.SUPABASE_JWT_AUD }}
      SUPABASE_ANON_KEY: ${{ secrets.SUPABASE_ANON_KEY }}
      SUPABASE_JWT_SECRET: ${{ secrets.SUPABASE_JWT_SECRET }}
      PLAID_CLIENT_ID: ${{ secrets.PLAID_CLIENT_ID }}
      PLAID_SECRET: ${{ secrets.PLAID_SECRET }}
      PLAID_ENV: ${{ secrets.PLAID_ENV }}
      PLAID_PRODUCTS: ${{ secrets.PLAID_PRODUCTS }}
      PLAID_COUNTRY_CODES: ${{ secrets.PLAID_COUNTRY_CODES }}
      PLAID_WEBHOOK_URL: ${{ secrets.PLAID_WEBHOOK_URL }}
      PLAID_REDIRECT_URI: ${{ secrets.PLAID_REDIRECT_URI }}
      PLAID_CLIENT_NAME: ${{ secrets.PLAID_CLIENT_NAME }}
      PLAID_TOKEN_ENCRYPTION_KEY: ${{ secrets.PLAID_TOKEN_ENCRYPTION_KEY }}
      PLAID_TOKEN_ENCRYPTION_KEYS: ${{ secrets.PLAID_TOKEN_ENCRYPTION_KEYS }}
      PRIVACY_POLICY_URL: ${{ secrets.PRIVACY_POLICY_URL }}
      PRIVACY_POLICY_VERSION: ${{ secrets.PRIVACY_POLICY_VERSION }}
      PRIVACY_POLICY_EFFECTIVE_DATE: ${{ secrets.PRIVACY_POLICY_EFFECTIVE_DATE }}

    steps:
      - name: Check out code
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.13"
          cache: pip
          cache-dependency-path: requirements.txt

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Validate production Django configuration
        run: python manage.py check --deploy --settings=zapp.settings.production

      - name: Run production safety smoke tests
        run: python manage.py test zapp.security --settings=zapp.settings.test --verbosity 2

  deploy:
    runs-on: ubuntu-latest
    needs: validate
    environment: production
    if: ${{ secrets.DEPLOY_WEBHOOK_URL != '' }}

    steps:
      - name: Trigger deployment webhook
        run: |
          curl --fail --silent --show-error \
            -X POST \
            -H "Authorization: Bearer ${{ secrets.DEPLOY_WEBHOOK_TOKEN }}" \
            "${{ secrets.DEPLOY_WEBHOOK_URL }}"
