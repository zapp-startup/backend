services:
  - type: web
    name: zapp-backend
    runtime: python
    rootDir: .
    buildCommand: pip install -r requirements.txt
    startCommand: gunicorn config.wsgi:application --bind 0.0.0.0:$PORT
    healthCheckPath: /healthz/
    envVars:
      - key: PYTHON_VERSION
        value: 3.13.0
      - key: DJANGO_SETTINGS_MODULE
        value: config.settings.production
      - key: SECRET_KEY
        generateValue: true
      - key: ALLOWED_HOSTS
        value: api.zappai.co,zappai.co,www.zappai.co
      - key: CORS_ALLOWED_ORIGINS
        value: https://zappai.co,https://www.zappai.co
      - key: CSRF_TRUSTED_ORIGINS
        value: https://zappai.co,https://www.zappai.co,https://api.zappai.co
